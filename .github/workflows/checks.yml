name: checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the pages and confirm the committed HTML matches
        run: |
          python tools/build.py
          git diff --exit-code
      - name: Plain ASCII, no flagged phrases
        run: python tools/check_text.py
      - name: Internal links, assets and anchors
        run: python tools/check_links.py
